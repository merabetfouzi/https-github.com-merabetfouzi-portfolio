<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folder CMS Dashboard</title>
<style>
  body { font-family: 'Inter', sans-serif; background: #f4f4f5; padding: 2rem; color: #111; }
  .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 3rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
  h1 { margin-top: 0; margin-bottom: 2rem; font-weight: 600; display:flex; justify-content:space-between; align-items:center; }
  .folder-card { border: 1px solid #e4e4e7; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 8px; background: #fafafa; }
  .folder-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .folder-header h3 { margin: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 1rem; }
  .color-swatch { width: 24px; height: 24px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
  .folder-details { display: none; margin-top: 1.5rem; border-top: 1px solid #e4e4e7; padding-top: 1.5rem; }
  .folder-details.open { display: block; }
  .form-group { margin-bottom: 1.2rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.85rem; color: #555; }
  input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #d4d4d8; border-radius: 6px; font-family: inherit; }
  textarea { height: 100px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  button { padding: 0.8rem 1.5rem; background: #111; color: #fff; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  button:hover { opacity: 0.8; }
  .btn-secondary { background: #e4e4e7; color: #111; }
  .btn-danger { background: #ef4444; color: #fff; }
  .actions { display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; border-top: 1px solid #e4e4e7; padding-top: 2rem; }
  .header-actions { display: flex; gap: 0.5rem; }
</style>
</head>
<body>

<div class="container">
  <h1><span>Folder Dashboard</span> <div><button onclick="addFolder()" class="btn-secondary">+ Add Folder</button> <a href="/" target="_blank"><button class="btn-secondary">View Site</button></a></div></h1>
  
  <div class="form-group">
    <label>Site Title</label>
    <input type="text" id="site-title" onchange="markDirty()">
  </div>
  
  <div id="folders-list"></div>
  
  <div class="actions">
    <span id="save-status" style="margin-right:auto; align-self:center; color:#10b981; font-weight:bold;"></span>
    <button onclick="saveData()">Save Changes</button>
  </div>
</div>

<script>
let state = { site_title: "", folders: [] };

async function loadData() {
  const res = await fetch('/api/data');
  state = await res.json();
  render();
}

function render() {
  document.getElementById('site-title').value = state.site_title;
  const list = document.getElementById('folders-list');
  list.innerHTML = '';
  
  state.folders.forEach((f, index) => {
    const card = document.createElement('div');
    card.className = 'folder-card';
    
    card.innerHTML = `
      <div class="folder-header" onclick="toggleDetails(${index})">
        <h3><div class="color-swatch" style="background:${f.bg}"></div> ${f.tab} — ${f.title}</h3>
        <div class="header-actions">
           <button class="btn-secondary" onclick="event.stopPropagation(); moveUp(${index})" ${index === 0 ? 'disabled':''}>↑</button>
           <button class="btn-secondary" onclick="event.stopPropagation(); moveDown(${index})" ${index === state.folders.length-1 ? 'disabled':''}>↓</button>
           <button class="btn-danger" onclick="event.stopPropagation(); removeFolder(${index})">Delete</button>
        </div>
      </div>
      <div class="folder-details" id="details-${index}">
        <div class="row">
            <div class="form-group">
                <label>Tab Name (e.g., INTRO, BRANDING)</label>
                <input type="text" value="${f.tab}" oninput="updateField(${index}, 'tab', this.value)">
            </div>
            <div class="form-group">
                <label>Tab X Offset (e.g., 5%, 50%)</label>
                <input type="text" value="${f.tab_x}" oninput="updateField(${index}, 'tab_x', this.value)">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Background Color (Hex)</label>
                <input type="color" value="${f.bg}" oninput="updateField(${index}, 'bg', this.value)">
            </div>
            <div class="form-group">
                <label>Text Color (Hex)</label>
                <input type="color" value="${f.fg}" oninput="updateField(${index}, 'fg', this.value)">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Title</label>
                <input type="text" value="${f.title}" oninput="updateField(${index}, 'title', this.value)">
            </div>
            <div class="form-group">
                <label>Subtitle / Meta</label>
                <input type="text" value="${f.subtitle}" oninput="updateField(${index}, 'subtitle', this.value)">
            </div>
        </div>
        <div class="form-group">
            <label>Content HTML (Rendered inside the folder body)</label>
            <textarea oninput="updateField(${index}, 'content_html', this.value)">${f.content_html}</textarea>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Image URL (Optional)</label>
                <input type="text" value="${f.image_url}" oninput="updateField(${index}, 'image_url', this.value)">
            </div>
            <div class="form-group">
                <label>Call to Action Link (Optional)</label>
                <input type="text" value="${f.link_url}" oninput="updateField(${index}, 'link_url', this.value)">
            </div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });
}

function toggleDetails(index) {
  const el = document.getElementById(\`details-\${index}\`);
  el.classList.toggle('open');
}

function updateField(index, field, value) {
  state.folders[index][field] = value;
}

function markDirty() {
  state.site_title = document.getElementById('site-title').value;
}

function addFolder() {
  state.folders.push({
    id: "f_" + Date.now(),
    tab: "NEW FOLDER",
    bg: "#E8E8E8",
    fg: "#111111",
    tab_x: "10%",
    title: "New Project",
    subtitle: "Category",
    content_html: "<p>Description</p>",
    image_url: "",
    link_url: ""
  });
  render();
}

function removeFolder(index) {
  if(confirm("Are you sure you want to delete this folder?")) {
    state.folders.splice(index, 1);
    render();
  }
}

function moveUp(index) {
  if(index > 0) {
    const temp = state.folders[index];
    state.folders[index] = state.folders[index-1];
    state.folders[index-1] = temp;
    render();
  }
}
function moveDown(index) {
  if(index < state.folders.length-1) {
    const temp = state.folders[index];
    state.folders[index] = state.folders[index+1];
    state.folders[index+1] = temp;
    render();
  }
}

async function saveData() {
  markDirty();
  const res = await fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(state)
  });
  if(res.ok) {
    const status = document.getElementById('save-status');
    status.innerText = "Saved successfully!";
    setTimeout(() => status.innerText = "", 3000);
    render();
  }
}

loadData();
</script>
</body>
</html>
